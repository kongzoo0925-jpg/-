<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="-nYHtFiof3qdZvdPS5OBGrdMaLsOxbi4U9fwYgjsDS8" />
<title>문의하기 | 계산모음</title>
<meta name="description" content="계산모음에 대한 문의, 오류 신고, 계산기 추가 제안을 남겨주세요.">
<link rel="canonical" href="https://cash1-bq6.pages.dev/contact.html">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .form-field{margin-bottom:16px}
  .form-field input[type=text],.form-field input[type=email],.form-field textarea{
    width:100%;font-family:inherit;font-size:15px;font-weight:500;text-align:left;
    padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .form-field textarea{min-height:130px;resize:vertical;line-height:1.6}
  .form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--teal)}
  .submit-btn{width:100%;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
    background:var(--teal);color:#fff;border:none;border-radius:10px;padding:15px;transition:background .15s}
  .submit-btn:hover{background:var(--teal-deep)}
  .form-msg{margin-top:14px;font-size:14px;text-align:center;font-weight:600;display:none}
</style>
</head>
<body>

<nav class="nav"><div class="nav-inner">
  <a href="index.html" class="logo">계산<span>모음</span></a>
  <div class="nav-links">
    <a href="salary.html">연봉 실수령액</a>
    <a href="severance.html">퇴직금</a>
    <a href="unemployment.html">실업급여</a>
  </div>
</div></nav>

<div class="wrap">
  <header><h1>문의하기</h1><p>오류 신고, 계산기 추가 제안, 기타 문의를 남겨주세요</p></header>

  <main class="card">
    <!-- ★ 설정 필요: action의 YOUR_FORM_ID를 본인 Formspree 폼 ID로 바꾸세요 (아래 설명 참고) -->
    <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <div class="form-field">
        <label for="name">이름 (선택)</label>
        <input type="text" id="name" name="name" placeholder="홍길동" autocomplete="off">
      </div>
      <div class="form-field">
        <label for="email">답변받을 이메일</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
      </div>
      <div class="form-field">
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" placeholder="문의하실 내용을 자유롭게 적어주세요." required></textarea>
      </div>
      <button type="submit" class="submit-btn">문의 보내기</button>
      <div class="form-msg" id="form-msg"></div>
    </form>
  </main>

  <section class="content">
    <h2>안내</h2>
    <p>남겨주신 이메일은 문의 답변 목적으로만 사용되며, 다른 용도로 활용하거나 제3자에게 제공하지 않습니다. 계산 결과 오류나 최신 요율 반영 요청은 큰 도움이 되니 편하게 알려주세요.</p>
  </section>

  <footer>
    <a href="index.html">홈</a> · <a href="privacy.html">개인정보처리방침</a> · <a href="terms.html">이용약관</a>
  </footer>
</div>

<script>
(function(){
  const form=document.getElementById('contact-form');
  const msg=document.getElementById('form-msg');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    // Formspree 미설정 상태 안내
    if(form.action.indexOf('YOUR_FORM_ID')>-1){
      msg.style.display='block';msg.style.color='#E0607A';
      msg.textContent='문의 폼이 아직 설정되지 않았습니다. (관리자: Formspree 연동 필요)';
      return;
    }
    try{
      const res=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}});
      msg.style.display='block';
      if(res.ok){msg.style.color='var(--teal-deep)';msg.textContent='문의가 정상적으로 접수되었습니다. 감사합니다!';form.reset();}
      else{msg.style.color='#E0607A';msg.textContent='전송 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.';}
    }catch(err){
      msg.style.display='block';msg.style.color='#E0607A';
      msg.textContent='전송 중 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.';
    }
  });
})();
</script>
</body>
</html>
